name: publish

# Publishes to the Comfy Registry, which is what ComfyUI Manager installs from.
# Publication is intentionally manual and requires approval in the `registry`
# environment. It needs a
# REGISTRY_ACCESS_TOKEN repository secret from https://registry.comfy.org.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    runs-on: ubuntu-latest
    environment: registry
    steps:
      - uses: actions/checkout@v4
      - name: Check the registry metadata is filled in
        # The action's own failure for a placeholder publisher is a bare API error.
        run: |
          python - <<'PY'
          import tomllib
          comfy = tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("comfy", {})
          publisher = str(comfy.get("PublisherId", ""))
          if not publisher or publisher.startswith("TODO"):
              raise SystemExit(
                  "Set [tool.comfy] PublisherId in pyproject.toml to the publisher id "
                  "from https://registry.comfy.org before publishing."
              )
          PY
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
