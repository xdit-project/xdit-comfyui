- name: qwen_image.default
  tags: [release, lucid, mad, instinct, gfx942, gfx950]
  model: Qwen/Qwen-Image-2512
  runner: xdit
  args:
    prompt: A cat holding a sign that says hello world
    height: 2048
    width: 2048
    seed: 42
    num_inference_steps: 50
    guidance_scale: 0.0
    num_iterations: 25
    ulysses_degree: 8
    use_torch_compile: true
    attention_backend: aiter

