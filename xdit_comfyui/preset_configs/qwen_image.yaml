- name: qwen_image.4gpu.rdna4
  tags: [rdna4, gfx1201]
  model: Qwen/Qwen-Image-2512
  runner: xdit
  args:
    seed: 42
    prompt: A cat holding a sign that says hello world
    height: 2048
    width: 2048
    num_inference_steps: 50
    warmup_calls: 2
    num_iterations: 5
    guidance_scale: 0.0
    attention_backend: aiter_flydsl_fp8
    use_torch_compile: true
    use_fp8_gemms: true
    enable_tiling: true
    cache_method: dbcache
    cache_config:
      residual_diff_threshold: 0.1
    use_fp8_text_encoder: true
    ulysses_degree: 4
    fully_shard_degree: 2
    memory_efficient_sharding: true
    use_parallel_vae: true
    vae_tile_size_height: 352
    vae_tile_size_width: 2048
    vae_tile_overlap_height: 88
    vae_tile_overlap_width: 0

