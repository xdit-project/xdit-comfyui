- name: flux_kontext.default
  tags: [release, mad, lucid, instinct, gfx942, gfx950]
  model: black-forest-labs/FLUX.1-Kontext-dev
  runner: xdit
  args:
    seed: 42
    prompt: Add a cool hat to the cat
    height: 1024
    width: 1024
    num_inference_steps: 30
    max_sequence_length: 512
    warmup_calls: 5
    ulysses_degree: 8
    use_torch_compile: true
    input_images: https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/cat.png
    guidance_scale: 2.5
    num_iterations: 25
    attention_backend: aiter

