- name: flux2_klein.4gpu.rdna4
  tags: [rdna4, gfx1201]
  model: black-forest-labs/FLUX.2-klein-9B
  runner: xdit
  args:
    seed: 42
    prompt: A spectacular sunset over the ocean
    height: 2048
    width: 2048
    num_inference_steps: 4
    warmup_calls: 2
    num_iterations: 5
    guidance_scale: 1.0
    attention_backend: aiter_flydsl_fp8
    ulysses_degree: 4
    use_torch_compile: true
    use_fp8_gemms: true
    enable_tiling: true
    use_parallel_vae: true
    memory_efficient_replicated_load: true
    use_fp8_text_encoder: true
    vae_tile_size_height: 352
    vae_tile_size_width: 2048
    vae_tile_overlap_height: 88
    vae_tile_overlap_width: 0

