- name: flux2.i2i_1k.4gpu.rdna4
  tags: [rdna4, gfx1201]
  model: black-forest-labs/FLUX.2-dev
  runner: xdit
  args:
    seed: 42
    prompt: Add a cool hat to the cat
    height: 1024
    width: 1024
    num_inference_steps: 25
    max_sequence_length: 512
    warmup_calls: 2
    num_iterations: 5
    guidance_scale: 4.0
    input_images: https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/cat.png
    attention_backend: aiter_flydsl_fp8
    use_torch_compile: true
    use_fp8_gemms: true
    cache_method: dbcache
    cache_config:
      residual_diff_threshold: 0.16
      enable_taylorseer: false
    use_fp8_text_encoder: true
    ulysses_degree: 4
    fully_shard_degree: 2
    memory_efficient_sharding: true
    use_parallel_vae: true
    enable_tiling: true
    vae_tile_size_height: 352
    vae_tile_size_width: 1024
    vae_tile_overlap_height: 88
    vae_tile_overlap_width: 0

