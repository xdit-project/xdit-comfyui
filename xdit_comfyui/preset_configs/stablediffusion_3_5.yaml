- name: stablediffusion_3_5.4gpu.rdna4
  tags: [rdna4, gfx1201]
  model: stabilityai/stable-diffusion-3.5-large
  runner: xdit
  args:
    seed: 42
    prompt: A capybara holding a sign that reads Hello World
    height: 1024
    width: 1024
    num_inference_steps: 28
    warmup_calls: 2
    num_iterations: 5
    guidance_scale: 3.5
    attention_backend: aiter_flydsl_fp8
    use_cfg_parallel: true
    ulysses_degree: 2
    use_torch_compile: true
    enable_tiling: true
    enable_slicing: true
    vae_tile_size_height: 512
    vae_tile_size_width: 512
    vae_tile_overlap_height: 128
    vae_tile_overlap_width: 128
    cache_method: dbcache

